[package]
name = "omadesign"
version = "0.0.1-alpha.rc"
edition = "2024"
description = "Native Linux studio for design, painting, photography, and motion"
license = "MIT"
repository = "https://github.com/michaelmonetized/omadesign"

[lib]
name = "omadesign"
path = "src/lib.rs"

[[bin]]
name = "omadesign"
path = "src/main.rs"

[[bin]]
name = "gen_media"
path = "src/bin/gen_media.rs"

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.22"
eframe = "0.36.1"
geo = "0.33.1"
ureq = { version = "2.10", features = ["tls"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "tiff",
] }
rayon = "1.10"
rustybuzz = "0.20"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-skia = "0.12.0"

# winit 0.30 only emits PinchGesture on macOS/iOS. This tree adds Wayland
# zwp_pointer_gestures_v1 so a trackpad pinch zooms the canvas.
[patch.crates-io]
winit = { path = "vendor/winit" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
