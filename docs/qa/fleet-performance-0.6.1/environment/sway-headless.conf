# Task-only isolated GPU display. No user desktop configuration is imported.
xwayland disable
output HEADLESS-1 mode 1600x1000@60Hz scale 1
output HEADLESS-1 position 0 0
workspace 1 output HEADLESS-1
default_border none
default_floating_border none
floating_minimum_size 1440 x 900
floating_maximum_size 1440 x 900
for_window [all] floating enable
for_window [all] border none
for_window [all] resize set width 1440 px height 900 px
for_window [all] move position center
focus_follows_mouse no
seat seat0 hide_cursor 1000
